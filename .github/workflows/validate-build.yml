name: Validate Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Build AGENTS.md
        run: npm run build
        working-directory: scripts

      - name: Verify AGENTS.md is up to date
        run: |
          if ! git diff --exit-code AGENTS.md; then
            echo "::error::AGENTS.md is out of date. Run 'npm run build' in scripts/ and commit the result."
            exit 1
          fi
